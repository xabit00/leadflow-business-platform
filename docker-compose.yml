version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-leadflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadflow_user} -d ${POSTGRES_DB:-leadflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
